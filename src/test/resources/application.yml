spring:
  aop:
    proxy-target-class: true
  datasource:
    url: jdbc:h2:mem:evops-test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true

# 测试素材落到临时目录，不污染工作区文件仓
evops:
  asset:
    storage-dir: ${java.io.tmpdir}/evops-test-assets

logging:
  level:
    com.evops: WARN
